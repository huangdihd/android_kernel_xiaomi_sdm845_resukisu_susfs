name: Build SDM845 Kernels

# Builds the DroidSpaces + susfs 2.2.0 kernel for every Xiaomi SDM845 device.
# Each device = mi845_defconfig + vendor/xiaomi/<device>.config + droidspaces.config,
# packaged into a per-device AnyKernel3 flashable zip.

on:
  workflow_dispatch:
    inputs:
      devices:
        description: "Devices to build: space-separated codenames or 'all'"
        default: "all"
      make_release:
        description: "Publish a new timestamped release with the built zips"
        type: boolean
        default: false
  push:
    tags:
      - "droidspaces-*"   # tag push builds all devices and publishes to that release

permissions:
  contents: write

env:
  # ZyC clang (same toolchain family as the local build). Clang 16 is a stable
  # choice for this 4.9 tree. Swap for another version if desired:
  #   Clang-main-link.txt (latest, currently clang 23), Clang-15-link.txt, Clang-14-link.txt
  CLANG_LINK_FILE: "https://raw.githubusercontent.com/ZyCromerZ/Clang/main/Clang-16-link.txt"
  # ccache-ECS (cctv18) — faster ccache fork for kernel builds. Static x86_64 binary.
  CCACHE_ECS_URL: "https://github.com/cctv18/ccache-ECS/releases/download/ccache-ECS-v1.0/linux-x86_64-musl-static-binary.zip"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      do_release: ${{ steps.set.outputs.do_release }}
    steps:
      - id: set
        name: Compute device matrix
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            sel="all"; dorel="true"
          else
            sel="${{ github.event.inputs.devices }}"
            dorel="${{ github.event.inputs.make_release }}"
          fi
          if [ -z "$sel" ] || [ "$sel" = "all" ]; then
            sel="beryllium dipper equuleus perseus polaris ursa"
          fi
          arr=$(printf '%s\n' $sel | jq -R . | jq -sc .)
          echo "matrix={\"device\":$arr}" >> "$GITHUB_OUTPUT"
          echo "do_release=${dorel:-false}" >> "$GITHUB_OUTPUT"
          echo "Building: $sel   release: ${dorel:-false}"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev make git zip unzip curl \
            libncurses-dev gcc python3 cpio gzip lz4

      - name: Set up ccache-ECS (cctv18)
        run: |
          mkdir -p "$HOME/ccache-ECS"
          curl -fSL -o /tmp/ccache-ecs.zip "$CCACHE_ECS_URL"
          unzip -oq /tmp/ccache-ecs.zip -d "$HOME/ccache-ECS"
          chmod +x "$HOME/ccache-ECS/ccache"
          echo "$HOME/ccache-ECS" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.device }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.device }}-
            ccache-

      - name: Download ZyC clang
        run: |
          mkdir -p "$HOME/clang"
          url="$(curl -fsSL "$CLANG_LINK_FILE" | tr -d ' \r\n')"
          echo "clang tarball: $url"
          curl -fSL -o /tmp/clang.tar.gz "$url"
          tar -xzf /tmp/clang.tar.gz -C "$HOME/clang"
          # bin/clang is a symlink, so locate the real clang-NN binary; its dir is the toolchain bin.
          clang_bin="$(dirname "$(find "$HOME/clang" -type f -name 'clang-[0-9]*' | head -1)")"
          echo "clang bin dir: $clang_bin"
          # Fail loudly instead of silently falling back to the runner's system clang.
          test -x "$clang_bin/clang"   || { echo "::error::clang not found in toolchain";  exit 1; }
          test -x "$clang_bin/ld.lld"  || { echo "::error::ld.lld not found in toolchain"; exit 1; }
          echo "$clang_bin" >> "$GITHUB_PATH"
          "$clang_bin/clang" --version | head -1

      - name: Build ${{ matrix.device }}
        run: |
          export ARCH=arm64 SUBARCH=arm64
          export KBUILD_BUILD_USER=github-actions KBUILD_BUILD_HOST=sdm845-ci
          ccache -M 5G >/dev/null 2>&1 || true
          ccache -z >/dev/null 2>&1 || true

          make O=out ARCH=arm64 mrproper
          make O=out ARCH=arm64 vendor/xiaomi/mi845_defconfig
          scripts/kconfig/merge_config.sh -O out out/.config \
            arch/arm64/configs/vendor/xiaomi/${{ matrix.device }}.config \
            arch/arm64/configs/vendor/xiaomi/droidspaces.config

          # never let a stale image be packaged as a success
          rm -f out/arch/arm64/boot/Image.gz-dtb

          make -j"$(nproc)" O=out ARCH=arm64 \
            CC="ccache clang -fuse-ld=lld" LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            LLVM_IAS=1 KCFLAGS="-Wno-error"

          test -f out/arch/arm64/boot/Image.gz-dtb || { echo "::error::${{ matrix.device }}: kernel image not produced"; exit 1; }
          ccache -s 2>/dev/null | grep -iE "hits|miss" || true

      - name: Package with AnyKernel3
        run: |
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          sed -i "s/^device\.name1=.*/device.name1=${{ matrix.device }}/" anykernel.sh
          NAME="DroidSpaces-${{ matrix.device }}-lineage22.2-$(date +%Y%m%d).zip"
          zip -r9 "$NAME" * -x '.git*' '.github/*' README.md '*.zip' >/dev/null
          echo "ZIP_NAME=$NAME" >> "$GITHUB_ENV"
          echo "ZIP_PATH=$PWD/$NAME" >> "$GITHUB_ENV"
          echo "Packaged: $NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error

  # Cupid-style: each build publishes a brand-new, timestamped release with all
  # zips (never overwrites a previous one). Single serial job avoids the race
  # where parallel matrix jobs would clash on the same release.
  release:
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.outputs.do_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (read susfs version)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download all built zips
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish timestamped release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t zips < <(find dist -type f -name '*.zip' | sort)
          if [ "${#zips[@]}" -eq 0 ]; then
            echo "::error::no kernel zips were built — nothing to publish"; exit 1
          fi
          BUILD_TIME=$(date -u +"%Y%m%d_%H%M")
          SUSFS_VER=$(grep -m1 '#define SUSFS_VERSION' include/linux/susfs.h | awk -F'"' '{print $2}')
          if [ "${{ github.event_name }}" = "push" ]; then
            REL_NAME="${{ github.ref_name }}"
          else
            REL_NAME="SDM845-DroidSpaces-susfs${SUSFS_VER}-${BUILD_TIME}"
          fi
          echo "Publishing ${#zips[@]} zip(s) as new release: $REL_NAME"
          cat > notes.md <<EOF
          # DroidSpaces kernel for Xiaomi SDM845 (all devices)

          | feature | value |
          | --- | --- |
          | Devices | beryllium · dipper · equuleus · perseus · polaris · ursa |
          | Build time (UTC) | ${BUILD_TIME} |
          | SUSFS | ${SUSFS_VER} |
          | KernelSU | ReSukiSU |
          | DroidSpaces | Supported |
          | Baseband-guard | Supported |

          Flash the zip matching your device in a custom recovery (Apply update -> ADB sideload). Back up your boot partition first.
          EOF
          gh release create "$REL_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$REL_NAME" \
            --notes-file notes.md \
            "${zips[@]}"
          echo "REL_NAME=$REL_NAME" >> "$GITHUB_ENV"
          echo "SUSFS_VER=$SUSFS_VER" >> "$GITHUB_ENV"

      - name: Telegram notification
        if: success()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set -uo pipefail
          if [ -z "${TG_BOT_TOKEN:-}" ] || [ -z "${TG_CHAT_ID:-}" ]; then
            echo "Telegram secrets not configured (TG_BOT_TOKEN / TG_CHAT_ID). Skipping."
            exit 0
          fi
          # TG_CHAT_ID is "chat_id" or "chat_id:topic_id" (for forum/topic groups).
          if [[ "$TG_CHAT_ID" == *:* ]]; then
            ID="${TG_CHAT_ID%%:*}"; THREAD="${TG_CHAT_ID##*:}"
          else
            ID="$TG_CHAT_ID"; THREAD=""
          fi
          # Derive a public group link from an @username chat id.
          if [[ "$ID" == @* ]]; then GROUP_URL="https://t.me/${ID#@}"; else GROUP_URL=""; fi
          JOIN_LINE=""
          [ -n "$GROUP_URL" ] && JOIN_LINE="
          📢 <a href=\"${GROUP_URL}\"><b>JOIN TELEGRAM GROUP</b></a>"

          REL_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/${REL_NAME}"
          MSG_TEXT="🚀 <b>Xiaomi SDM845 DroidSpaces Kernel — build successful!</b>
          ━━━━━━━━━━━━━━━━━━
          <b>🏷️ Release:</b> <code>${REL_NAME}</code>
          <b>📱 Devices:</b> beryllium · dipper · equuleus · perseus · polaris · ursa
          <b>🛡️ SUSFS:</b> ${SUSFS_VER}
          <b>🔐 KernelSU:</b> ReSukiSU
          <b>🌐 DroidSpaces:</b> Supported
          <b>📡 Baseband-guard:</b> Supported
          ━━━━━━━━━━━━━━━━━━
          👉 <a href=\"${REL_URL}\"><b>📥 GET YOUR KERNEL HERE</b></a>${JOIN_LINE}"
          PAYLOAD=$(jq -n --arg chat_id "$ID" --arg text "$MSG_TEXT" --arg thread "$THREAD" \
            '{chat_id:$chat_id, parse_mode:"HTML", disable_web_page_preview:true, text:$text}
             + (if $thread != "" then {message_thread_id: ($thread|tonumber)} else {} end)')
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" -d "$PAYLOAD")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Telegram notification sent."
          else
            echo "::warning::Telegram push failed (HTTP $HTTP_CODE): $(echo "$RESPONSE" | head -n -1)"
          fi
